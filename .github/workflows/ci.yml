name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: instagram
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d instagram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/instagram
      AUTH_JWT_SECRET: ci-only-secret-that-is-longer-than-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check app tests scripts migrations
      - run: uv run ruff format --check app tests scripts migrations
      - run: uv run mypy app/core
      - run: uv run alembic upgrade head
      - run: uv run pytest
